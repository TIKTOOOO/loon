name: Install reviewed public location plugin
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: tar -xzf location-spoofer-release.tar.gz
      - run: node --test tests/local-disable.cjs location-picker/worker/test/*.test.mjs
        working-directory: location-spoofer/source
      - run: node test-ios12-compat.js
        working-directory: location-spoofer/source
      - name: Publish reviewed plugin and corresponding source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 插件/ios-location-spoofer.lpx 插件/scripts/ios-location-spoofer.js location-spoofer
          if ! git diff --cached --quiet; then
            git commit -m 'Publish maintained location plugin, Cloudflare picker and shortcut guide'
            git push origin HEAD:main
          fi
